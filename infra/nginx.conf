# Install inside nginx's http context. Certificate must cover all five names.
limit_req_zone $binary_remote_addr zone=alamut_auth:10m rate=10r/m;
map $host $alamut_upstream {
    default "";
    alamut.bar 127.0.0.1:3001;
    driver.alamut.bar 127.0.0.1:3002;
    owner.alamut.bar 127.0.0.1:3003;
    inspector.alamut.bar 127.0.0.1:3004;
    admin.alamut.bar 127.0.0.1:3005;
}
server {
    listen 443 ssl;
    server_name alamut.bar driver.alamut.bar owner.alamut.bar inspector.alamut.bar admin.alamut.bar;
    if ($alamut_upstream = "") { return 421; }
    ssl_certificate /etc/letsencrypt/live/alamut.bar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alamut.bar/privkey.pem;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_read_timeout 90s;
    location ~ ^/(api/auth/(login|register|recovery(/confirm)?)/?|django-admin/login/?)$ {
        limit_req zone=alamut_auth burst=5 nodelay;
        proxy_pass http://$alamut_upstream;
    }
    location / { proxy_pass http://$alamut_upstream; }
}
server {
    listen 80;
    server_name alamut.bar driver.alamut.bar owner.alamut.bar inspector.alamut.bar admin.alamut.bar;
    if ($alamut_upstream = "") { return 421; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/alamut-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
