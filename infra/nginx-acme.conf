# Install this HTTP-only config until the first certificate is issued.
server {
    listen 80;
    server_name alamut.bar driver.alamut.bar owner.alamut.bar inspector.alamut.bar admin.alamut.bar;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/alamut-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 503; }
}
